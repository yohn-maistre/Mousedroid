name: Android fix build
on:
  workflow_dispatch:
  push:
    paths: ['client/**', '.github/workflows/android-build.yml']
  pull_request:
    paths: ['client/**', '.github/workflows/android-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure runner Android SDK
        run: |
          sdkmanager 'platforms;android-34' 'build-tools;35.0.0'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > client/local.properties
          chmod +x client/gradlew
      - name: Build app and regression-test APK; run JVM unit tests
        working-directory: client
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest
